[project]
name = "lmstudio-chat"
version = "0.1.0"
description = "LM Studio server chat web app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "mcp>=1.27.0",
]

# ✅ hatchling をビルドバックエンドに指定（uv 公式推奨・フラットレイアウト対応）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# ✅ 非推奨の dev-dependencies を dependency-groups に変更
[dependency-groups]
dev = []
