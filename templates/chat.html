<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>💬 LM Studio Chat</h2>
                <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
            </div>

            <!-- 接続状態 -->
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">接続確認中...</span>
            </div>

            <!-- モデル選択 -->
            <div class="sidebar-section">
                <label>モデル</label>
                <select id="modelSelect" class="sidebar-select">
                    <option value="">自動検出（デフォルト）</option>
                </select>
                <button class="btn-small" onclick="fetchModels()">🔄 更新</button>
            </div>

            <!-- パラメータ -->
            <div class="sidebar-section">
                <label>温度 (Temperature)</label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                <span id="temperatureValue">0.7</span>

                <label style="margin-top:10px">最大トークン数</label>
                <input type="number" id="maxTokens" min="2048" max="262144" value="8192" class="sidebar-input">
            </div>
            
            <!-- ツール設定 -->
            <div class="sidebar-section">
                <label>Function Calling ツール (JSON)</label>
                <textarea id="toolConfig" class="sidebar-input" rows="6" placeholder='[
  {
    "type": "function",
    "function": {
      "name": "search_web",
      "description": "ウェブ検索を実行",
      "parameters": {
        "type": "object",
        "properties": {
          "query": {"type": "string"}
        },
        "required": ["query"]
      }
    }
  }
]' style="font-family: monospace; font-size: 11px;"></textarea>
                <button class="btn-small" onclick="parseTools()">🔄 ツール読み込み</button>
                <div id="toolStatus" style="font-size:11px; margin-top:4px; color:#888;">⚠️ ツール未登録</div>
            </div>

            <!-- アクション -->
            <div class="sidebar-actions">
                <button class="btn-new-chat" onclick="newChat()">🆕 新規チャット</button>
                <button class="btn-clear" onclick="clearHistory()">🗑️ 履歴削除</button>
                <a href="/logout" class="btn-logout">🚪 ログアウト</a>
                <button class="btn-settings" onclick="showSettings()">⚙️ 設定</button>
            </div>

            <!-- 履歴 -->
            <div class="history-section">
                <label>チャット履歴</label>
                <div id="historyList" class="history-list">
                    {% for msg in history[:20] %}
                    <div class="history-item">
                        <span class="history-role {{ msg.role }}">{{ msg.role }}</span>
                        <span class="history-content">{{ msg.content[:60] }}...</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </aside>

        <!-- メインチャットエリア -->
        <main class="chat-main">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1>LM Studio Chat</h1>
                <div class="header-right">
                    <span class="lm-url" id="lmUrl">{{ lm_studio_url }}</span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- 初期メッセージ -->
                <div class="welcome-message">
                    <div class="welcome-icon">🤖</div>
                    <h2>LM Studio Chat へようこそ</h2>
                    <p>LM Studio のローカル LLM サーバーとチャットできます。</p>
                    <p style="margin-top:10px; color:#666;">メッセージを入力して送信してください。</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="メッセージを入力..."
                        rows="1"
                        class="chat-input"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    Enter で送信 • Shift+Enter で改行
                </div>
            </div>
        </main>
    </div>

    <!-- 設定モーダル -->
    <div class="modal-overlay" id="settingsModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>⚙️ 設定</h2>
                <button class="modal-close" onclick="hideSettings()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>LM Studio ホスト</label>
                    <input type="text" id="settingHost" value="{{ lm_studio_url.split('://')[1].split(':')[0] }}">
                </div>
                <div class="form-group">
                    <label>LM Studio ポート</label>
                    <input type="number" id="settingPort" value="{{ lm_studio_url.split('://')[1].split(':')[1] }}">
                </div>
                <div class="form-group">
                    <label>API キー</label>
                    <input type="password" id="settingApiKey" placeholder="APIキーを入力（空白の場合は認証なし）">
                </div>
                <div class="form-group">
                    <label>ユーザー名</label>
                    <input type="text" id="settingUsername" value="admin">
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" id="settingPassword" placeholder="新しいパスワード">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideSettings()">キャンセル</button>
                <button class="btn-save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ─── グローバル変数 ───────────────────────────────────────────────
        let currentSessionId = "{{ session_id }}";
        let isStreaming = false;
        let currentTools = [];

        // ─── 初期化 ──────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            checkConnection();
            fetchModels();
            updateTemperatureDisplay();
        });

        // ─── 接続確認 ────────────────────────────────────────────────────
        async function checkConnection() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const urlEl = document.getElementById('lmUrl');

            try {
                const res = await fetch('/api/models');
                if (res.ok) {
                    dot.style.background = '#4ade80';
                    text.textContent = '接続済み';
                } else {
                    throw new Error('認証エラー');
                }
            } catch (e) {
                dot.style.background = '#f87171';
                text.textContent = '接続エラー';
                addSystemMessage('⚠️ LM Studio サーバーに接続できません。サーバーが実行中か確認してください。');
            }
        }

        // ─── モデル取得 ─────────────────────────────────────────────────
        async function fetchModels() {
            const select = document.getElementById('modelSelect');
            try {
                const res = await fetch('/api/models');
                const data = await res.json();
                select.innerHTML = '<option value="">自動検出（デフォルト）</option>';
                data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.id;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('モデル取得エラー:', e);
            }
        }

        // ツール読み込み関数（修正版）
        function parseTools() {
            const raw = document.getElementById('toolConfig').value.trim();
            const statusEl = document.getElementById('toolStatus');
            if (!raw) {
                currentTools = [];
                if (statusEl) statusEl.textContent = '⚠️ ツール未登録';
                alert('ツール設定が空です');
                return;
            }
            try {
                const parsed = JSON.parse(raw);

                if (!Array.isArray(parsed)) {
                    alert('⚠️ 誤った形式です。OpenAI 互換の「ツールスキーマ配列」[ {type: "function", ...} ] を貼り付けてください。\n\nLM Studio の「Custom Tools」→「Export」から取得できます。');
                    return;
                }

                currentTools = parsed;
                const names = currentTools.map(t => t.function?.name || '?').join(', ');
                if (statusEl) statusEl.textContent = `✅ ${currentTools.length}件登録: ${names}`;
                alert(`✅ ${currentTools.length} 件のツールを登録しました\n\n${names}`);
            } catch (e) {
                alert('⚠️ JSON パースエラー: ' + e.message);
            }
        }

        // ─── チャット送信 ───────────────────────────────────────────────
        async function sendMessage() {
            if (isStreaming) return;

            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            // 入力クリア
            input.value = '';
            input.style.height = 'auto';

            // ユーザーメッセージ表示
            appendMessage('user', message);

            // 履歴構築
            const messages = [];
            const historyEl = document.getElementById('chatMessages');
            historyEl.querySelectorAll('.message-item').forEach(el => {
                if (el.dataset.role) {
                    messages.push({
                        role: el.dataset.role,
                        content: el.dataset.content
                    });
                }
            });

            // ローディング表示
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message-item message-assistant';
            loadingDiv.id = loadingId;
            loadingDiv.dataset.role = 'assistant';
            loadingDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="message-header">
                        <span class="message-role">🤖 AI</span>
                        <span class="message-time">${new Date().toLocaleTimeString()}</span>
                    </div>
                    <div class="message-content">
                        <div class="loading-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            historyEl.appendChild(loadingDiv);
            scrollToBottom();

            // API リクエスト
            const model = document.getElementById('modelSelect').value;
            const temperature = parseFloat(document.getElementById('temperature').value);
            const maxTokens = parseInt(document.getElementById('maxTokens').value);

            // ツールが登録されている場合はローディングメッセージに表示
            if (currentTools.length > 0) {
                const loadingContent = document.querySelector(`#${loadingId} .message-content`);
                if (loadingContent) {
                    loadingContent.innerHTML = `
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div style="font-size:11px; color:#888; margin-top:4px;">🔧 ツール使用中 (${currentTools.length}件登録済み)</div>
                    `;
                }
            }

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: messages,
                        model: model,
                        temperature: temperature,
                        max_tokens: maxTokens,
                        tools: currentTools   // ← ツール定義を送信
                    })
                });

                const data = await res.json();

                // ローディング削除
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                if (data.reply) {
                    appendMessage('assistant', data.reply);
                    updateHistoryList(data.history || []);
                } else if (data.error) {
                    addSystemMessage(`⚠️ エラー: ${data.error}`);
                }

            } catch (e) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                addSystemMessage(`⚠️ 通信エラー: ${e.message}`);
            }
        }

        // ─── メッセージ表示 ─────────────────────────────────────────────
        function appendMessage(role, content) {
            const historyEl = document.getElementById('chatMessages');
            const welcomeMsg = historyEl.querySelector('.welcome-message');
            if (welcomeMsg) welcomeMsg.remove();

            const div = document.createElement('div');
            div.className = `message-item message-${role === 'user' ? 'user' : 'assistant'}`;
            div.dataset.role = role;
            div.dataset.content = content;

            const time = new Date().toLocaleTimeString();
            const isUser = role === 'user';
            const icon = isUser ? '👤' : '🤖';

            // マークダウン風の簡易処理
            const formattedContent = formatContent(content);

            div.innerHTML = `
                <div class="message-bubble">
                    <div class="message-header">
                        <span class="message-role">${icon} ${isUser ? 'あなた' : 'AI'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-content">${formattedContent}</div>
                </div>
            `;

            historyEl.appendChild(div);
            scrollToBottom();
        }

        function formatContent(text) {
            // 簡易的なマークダウン変換
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\n/g, '<br>');

            // コードブロック内の改行を復元
            html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (match, code) => {
                return `<pre><code>${code}</code></pre>`;
            });

            return html;
        }

        function addSystemMessage(content) {
            const historyEl = document.getElementById('chatMessages');
            const welcomeMsg = historyEl.querySelector('.welcome-message');
            if (welcomeMsg) welcomeMsg.remove();

            const div = document.createElement('div');
            div.className = 'message-item message-system';
            div.innerHTML = `
                <div class="message-bubble message-bubble-system">
                    <div class="message-content">${content}</div>
                </div>
            `;
            historyEl.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const el = document.getElementById('chatMessages');
            setTimeout(() => {
                el.scrollTop = el.scrollHeight;
            }, 50);
        }

        // ─── 履歴管理 ───────────────────────────────────────────────────
        function updateHistoryList(history) {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            history.slice(-20).reverse().forEach(msg => {
                const item = document.createElement('div');
                item.className = 'history-item';
                const roleClass = msg.role === 'user' ? 'history-role-user' : 'history-role-assistant';
                const roleIcon = msg.role === 'user' ? '👤' : '🤖';
                item.innerHTML = `
                    <span class="history-role ${roleClass}">${roleIcon}</span>
                    <span class="history-content">${escapeHtml(msg.content.substring(0, 60))}${msg.content.length > 60 ? '...' : ''}</span>
                `;
                list.appendChild(item);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function newChat() {
            const historyEl = document.getElementById('chatMessages');
            historyEl.innerHTML = `
                <div class="welcome-message">
                    <div class="welcome-icon">🤖</div>
                    <h2>LM Studio Chat へようこそ</h2>
                    <p>LM Studio のローカル LLM サーバーとチャットできます。</p>
                    <p style="margin-top:10px; color:#666;">メッセージを入力して送信してください。</p>
                </div>
            `;
        }

        async function clearHistory() {
            if (!confirm('履歴を削除してもよろしいですか？')) return;
            try {
                await fetch('/api/clear-history', { method: 'POST' });
                newChat();
            } catch (e) {
                alert('履歴の削除に失敗しました');
            }
        }

        // ─── 設定モーダル ───────────────────────────────────────────────
        async function showSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';

            // 現在の設定を読み込む
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('settingHost').value = data.lm_studio_host;
                document.getElementById('settingPort').value = data.lm_studio_port;
                document.getElementById('settingUsername').value = data.app_username;
            } catch (e) {
                console.error('設定読み込みエラー:', e);
            }
        }

        function hideSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        async function saveSettings() {
            const host = document.getElementById('settingHost').value;
            const port = document.getElementById('settingPort').value;
            const apiKey = document.getElementById('settingApiKey').value;
            const username = document.getElementById('settingUsername').value;
            const password = document.getElementById('settingPassword').value;

            try {
                const res = await fetch('/api/update-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lm_studio_host: host,
                        lm_studio_port: parseInt(port),
                        lm_studio_api_key: apiKey,
                        app_username: username,
                        app_password: password,
                    })
                });

                if (res.ok) {
                    alert('設定を更新しました。サーバーを再起動してください。');
                    hideSettings();
                    // URL 更新
                    const newUrl = `http://${host}:${port}`;
                    document.getElementById('lmUrl').textContent = newUrl;
                } else {
                    alert('設定の更新に失敗しました');
                }
            } catch (e) {
                alert('設定の更新に失敗しました: ' + e.message);
            }
        }

        // ─── ユーティリティ ─────────────────────────────────────────────
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const reopenBtn = document.getElementById('sidebar-reopen-btn');
            
            sidebar.classList.toggle('collapsed');
            
            // サイドバーが隠れたら再表示ボタンを表示
            if (sidebar.classList.contains('collapsed')) {
                reopenBtn.style.display = 'flex';
            } else {
                reopenBtn.style.display = 'none';
            }
        }

        function updateTemperatureDisplay() {
            const slider = document.getElementById('temperature');
            const display = document.getElementById('temperatureValue');
            slider.addEventListener('input', () => {
                display.textContent = slider.value;
            });
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }
    </script>
    <button id="sidebar-reopen-btn" class="sidebar-reopen-btn" onclick="toggleSidebar()" title="サイドバーを表示">☰</button>
</body>
</html>
